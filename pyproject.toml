[project]
name = "resilient-uas-lab"
version = "0.2.0"
description = "Open-source resilience engineering and chaos testing for autonomous systems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/platform",
  "packages/cli",
  "adapters/mock",
  "adapters/px4-gazebo",
  "adapters/replay",
  "services/api",
  "services/orchestrator",
  "services/runner",
]

[tool.uv.sources]
reslab-core = { workspace = true }
reslab-platform = { workspace = true }
reslab-cli = { workspace = true }
reslab-adapter-mock = { workspace = true }
reslab-adapter-px4 = { workspace = true }
reslab-adapter-replay = { workspace = true }
reslab-api = { workspace = true }
reslab-orchestrator = { workspace = true }
reslab-runner = { workspace = true }

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.16.8",
  "hypothesis==6.168.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "node_modules", ".venv"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "N",                # naming
  "S",                # bandit (security)
  "ASYNC",            # async pitfalls
  "RUF",              # ruff-specific
  "PTH",              # pathlib
  "T20",              # no stray print
]
ignore = [
  "S101",   # assert is fine in tests and invariants
  "RUF012", # mutable class attributes handled by pydantic
  "B008",   # FastAPI/Typer dependency defaults
  "S104",   # binding 0.0.0.0 inside containers is intentional
  "ASYNC109", # explicit timeout parameters are part of our public signatures
  "ASYNC240", # tiny health-marker file writes are acceptable in async code
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "T20", "N802"]
"tests/**" = ["S", "T20"]
"packages/cli/**" = ["T20"]
"scripts/**" = ["T20", "S603", "S607"]
"security/policies/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = [
  "reslab_core", "reslab_platform", "reslab_cli", "reslab_adapter_mock",
  "reslab_adapter_px4", "reslab_adapter_replay", "reslab_api", "reslab_orchestrator",
  "reslab_runner",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
  "packages/core/tests",
  "packages/platform/tests",
  "packages/cli/tests",
  "adapters/mock/tests",
  "adapters/px4-gazebo/tests",
  "adapters/replay/tests",
  "services/api/tests",
  "services/orchestrator/tests",
  "services/runner/tests",
  "tests/integration",
]
markers = [
  "integration: requires running infrastructure (PostgreSQL, NATS, object store)",
  "simulation: requires a PX4 SITL simulator",
]
filterwarnings = ["error::DeprecationWarning:reslab_.*"]
