# NATS server configuration with per-service users and least-privilege subject
# permissions. Passwords are read from the environment at start-up (see
# compose.hardened.yaml); no credential is stored in this file.
#
# Subject layout (packages/core/reslab_core/protocol.py):
#   reslab.jobs.run                 job queue (API publishes, runners consume)
#   reslab.runs.<id>.*              lifecycle, events, telemetry, artifacts, finished
#   reslab.control.<id>.cancel      cancellation (API publishes, runners subscribe)
#   reslab.runners.heartbeat        runner heartbeats
#   $JS.API.>                       JetStream management (stream and consumer calls)

server_name: reslab-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

max_payload: 8MB

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 8GB
}

authorization {
  timeout: 2

  API = {
    publish = ["reslab.jobs.run", "reslab.control.>", "$JS.API.>", "_INBOX.>"]
    subscribe = ["reslab.runs.>", "reslab.runners.heartbeat", "_INBOX.>"]
  }
  ORCHESTRATOR = {
    publish = ["reslab.control.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
    subscribe = ["reslab.runs.>", "reslab.runners.heartbeat", "_INBOX.>"]
  }
  RUNNER = {
    publish = ["reslab.runs.>", "reslab.runners.heartbeat", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
    subscribe = ["reslab.jobs.run", "reslab.control.>", "_INBOX.>"]
  }

  users = [
    { user: api,          password: $NATS_API_PASSWORD,          permissions: $API }
    { user: orchestrator, password: $NATS_ORCHESTRATOR_PASSWORD, permissions: $ORCHESTRATOR }
    { user: runner,       password: $NATS_RUNNER_PASSWORD,       permissions: $RUNNER }
  ]
}
