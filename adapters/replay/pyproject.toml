[project]
name = "reslab-adapter-replay"
version = "0.1.0"
description = "Replay adapter re-emitting stored normalized telemetry and events."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "reslab-core",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reslab_adapter_replay"]
