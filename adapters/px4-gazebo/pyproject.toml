[project]
name = "reslab-adapter-px4"
version = "0.1.0"
description = "PX4 SITL + Gazebo adapter for Resilient UAS Lab (MAVSDK transport)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "reslab-core",
  "reslab-adapter-mock",
  "mavsdk==3.17.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reslab_adapter_px4"]
