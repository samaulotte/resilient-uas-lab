[project]
name = "reslab-platform"
version = "0.2.0"
description = "Resilient UAS Lab platform layer: settings, database models and migrations, event bus, artifact storage, logging."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "reslab-core",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.54",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "nats-py==2.16.0",
  "boto3==1.43.98",
  "structlog==26.1.0",
  "orjson==3.12.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reslab_platform"]
