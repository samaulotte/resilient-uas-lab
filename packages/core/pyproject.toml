[project]
name = "reslab-core"
version = "0.2.0"
description = "Resilient UAS Lab core domain library: scenario schema, run lifecycle, telemetry model, adapter contract, metrics, scoring and reports."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reslab_core"]
