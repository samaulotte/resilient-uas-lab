[project]
name = "reslab-orchestrator"
version = "0.1.0"
description = "Resilient UAS Lab orchestrator: run lifecycle, persistence, analysis and reporting."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "reslab-core",
  "reslab-platform",
  "prometheus-client==0.26.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reslab_orchestrator"]
