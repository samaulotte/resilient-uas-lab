[project]
name = "reslab-api"
version = "0.1.0"
description = "Resilient UAS Lab API service (FastAPI)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "reslab-core",
  "reslab-platform",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "websockets==17.1",
  "prometheus-client==0.26.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reslab_api"]
