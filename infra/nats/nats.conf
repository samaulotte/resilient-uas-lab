# NATS server configuration for Resilient UAS Lab.
# JetStream is required for the job queue and run streams.

server_name: reslab-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Artifact messages are base64 payloads capped at 4 MiB by the protocol.
max_payload: 8MB

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 8GB
}
