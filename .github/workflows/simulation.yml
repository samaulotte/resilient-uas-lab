name: Simulation (PX4 SITL)

# The PX4 SITL / Gazebo profile is heavy (multi-gigabyte image, several minutes of
# simulated flight per scenario) and is therefore not part of the required CI checks.
# It runs nightly and on demand. A failure here is a signal to investigate, not a
# merge blocker, until the profile has proven stable on hosted runners.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to execute against the simulator
        default: gnss-loss
        type: choice
        options:
          - gnss-loss
          - sensor-failure
          - datalink-loss
          - mission-compute-restart
          - compound-degradation

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  px4-sitl:
    name: PX4 SITL scenario run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCENARIO: ${{ inputs.scenario || 'gnss-loss' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.17"
          python-version: "3.12"
      - name: Install the command line interface
        run: uv sync --frozen --package reslab-cli
      - name: Free disk space for the simulator image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the platform with the simulation profile
        run: |
          cp .env.example .env
          echo "RESLAB_GIT_COMMIT=${GITHUB_SHA}" >> .env
          docker compose --profile sim up --build -d --wait --wait-timeout 600
          docker compose --profile sim ps
      - name: Wait for the simulation runner to register
        run: |
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/v1/system | grep -q '"px4-gazebo"'; then
              echo "simulation runner online"; exit 0
            fi
            sleep 5
          done
          echo "no runner advertising the px4-gazebo adapter registered in time"
          docker compose --profile sim logs --no-color --tail=200 runner-sim px4-sim
          exit 1
      - name: Execute the scenario against PX4 SITL
        run: |
          mkdir -p artifacts/simulation
          # Speed stays 1 for PX4: the scenario timeline is compared against the real
          # simulation clock, so faster-than-real event timing would desync the run.
          run_id="$(curl -sf -X POST http://localhost:8080/api/v1/runs \
            -H 'content-type: application/json' \
            -d "{\"scenario_name\":\"${SCENARIO}\",\"adapter\":\"px4-gazebo\",\"label\":\"sitl-ci\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "run_id=$run_id" | tee -a "$GITHUB_ENV"
          echo "queued run $run_id"
          deadline=$(( $(date +%s) + 1500 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state="$(curl -sf http://localhost:8080/api/v1/runs/$run_id \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            echo "  state=$state"
            case "$state" in COMPLETED|FAILED|CANCELLED) break ;; esac
            sleep 10
          done
      - name: Download the report and events
        if: always()
        run: |
          if [ -n "$run_id" ]; then
            uv run reslab report "$run_id" --api http://localhost:8080 \
              -o artifacts/simulation/report.json --html artifacts/simulation/report.html || true
            curl -sf "http://localhost:8080/api/v1/runs/$run_id/events?limit=5000" \
              > artifacts/simulation/events.json || true
          fi
      - name: A fault was actually applied and the run did not fail
        run: |
          python3 - "$run_id" <<'PY'
          import json, sys, urllib.request
          run_id = sys.argv[1]
          base = "http://localhost:8080/api/v1/runs/" + run_id
          run = json.load(urllib.request.urlopen(base))
          events = json.load(urllib.request.urlopen(base + "/events?limit=5000"))["events"]
          applied = [e for e in events if e["kind"] == "INJECTION_APPLIED"]
          rejected = [e for e in events if e["kind"] == "INJECTION_REJECTED"]
          print(f"state={run['state']} result={run['result']} "
                f"applied={len(applied)} rejected={len(rejected)}")
          if run["state"] != "COMPLETED":
              sys.exit(f"run did not complete: {run['state']} ({run.get('reason')})")
          if not applied:
              sys.exit("no fault injection was applied: PX4 realised nothing to observe")
          if run["result"] in ("failed", "inconclusive"):
              sys.exit(f"benchmark result is {run['result']}")
          print("PX4 SITL scenario passed with a real injected fault")
          PY
      - name: Simulator and runner logs
        if: always()
        run: docker compose --profile sim logs --no-color --tail=500 runner-sim px4-sim > artifacts/simulation/logs.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: simulation-${{ env.SCENARIO }}
          path: artifacts/simulation/
          retention-days: 30
          if-no-files-found: ignore
      - name: Stop the platform
        if: always()
        run: docker compose --profile sim down -v --remove-orphans
